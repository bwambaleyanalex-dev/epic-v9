<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EPIC V10 $5 FIXED</title><style>body{font-family:system-ui;background:#0a0e1a;color:#fff;padding:15px} .card{background:#151a2c;border-radius:16px;padding:16px;margin:12px 0;border:1px solid #2a3450} .badge{padding:6px 12px;border-radius:20px;font-weight:700} .paper{background:#00ff8820;border:1px solid #00ff88;color:#00ff88} button{width:100%;padding:14px;border-radius:12px;border:none;font-weight:700;font-size:16px;margin:6px 0} .btn-green{background:#00ff88;color:#000} .btn-red{background:#ff4444;color:#fff} .btn-dark{background:#2a3450;color:#fff} .price{font-size:32px;font-weight:800} .small{font-size:13px;opacity:.7}</style></head><body>
<h2>⚡ EPIC V10 - $5 SAFE FIXED</h2>
<div class="card"><span id="badge" class="badge paper">🛡️ SAFE - PAPER MODE</span><div class="price" id="price">Loading...</div><div class="small" id="ex">Binance: ... | KuCoin: checking | MEXC: checking</div><div class="small" id="ema">EMA200: loading...</div></div>
<div class="card"><div style="font-size:24px" id="bal">PAPER: $5.00</div><div class="small" id="pnl">P/L: +$0.00 | Trades: 0 | Max loss: $0.25</div><div class="small" id="pos">Position: FLAT</div></div>
<div class="card"><select id="coin" style="width:100%;padding:10px;border-radius:8px;background:#0a0e1a;color:#fff"><option value="BTCUSDT">BTC - $78k</option><option value="DOGEUSDT" selected>DOGE - $0.07 RECOMMENDED FOR $5</option><option value="SHIBUSDT">SHIB</option></select><button class="btn-green" onclick="buy()">📈 BUY Signal</button><button class="btn-red" onclick="sell()">📉 SELL Now</button></div>
<div class="card"><button class="btn-dark" onclick="resetBal()">Reset to $5 Paper</button></div>
<div class="card"><b>Trades</b><div id="trades" class="small">No trades yet</div></div>
<script>
let bal=parseFloat(localStorage.getItem('v10_bal')||'5'),pos=JSON.parse(localStorage.getItem('v10_pos')||'null'),trades=JSON.parse(localStorage.getItem('v10_trades')||'[]'),price=0,ema=0,lastCoin='';
function save(){localStorage.setItem('v10_bal',bal);localStorage.setItem('v10_pos',JSON.stringify(pos));localStorage.setItem('v10_trades',JSON.stringify(trades.slice(-20)));render()}
function render(){document.getElementById('bal').innerText=`PAPER: $${bal.toFixed(2)}`;let pnl=bal-5;document.getElementById('pnl').innerText=`P/L: ${pnl>=0?'+':''}$${pnl.toFixed(2)} (${((pnl/5)*100).toFixed(2)}%) | Trades: ${trades.length} | Max loss: $0.25`;if(pos){document.getElementById('pos').innerHTML=`<span style="color:#ffcc00">IN POSITION Entry $${pos.entry} | TP $${pos.tp.toFixed(6)} (+2%) | SL $${pos.sl.toFixed(6)} (-5%)</span>`}else{document.getElementById('pos').innerText='Position: FLAT - Ready to BUY'}document.getElementById('trades').innerHTML=trades.slice().reverse().map(t=>`${t.time} ${t.reason} P/L $${t.pnl}<br>`).join('')||'No trades yet'}
async function getPrice(){try{const sym=document.getElementById('coin').value;if(sym!==lastCoin){ema=0;lastCoin=sym}let r=await fetch(`https://api.binance.com/api/v3/ticker/price?symbol=${sym}`);let j=await r.json();price=parseFloat(j.price);if(ema===0)ema=price*0.998;else ema=ema*0.98+price*0.02;document.getElementById('price').innerText=`$${price}`;document.getElementById('ex').innerText=`Binance: $${price} | Live`;document.getElementById('ema').innerText=`EMA200: $${ema.toFixed(6)} | ${price>ema?'🟢 BUY SIGNAL READY':'🔴 WAIT'} | TP 2% SL 5%`;}catch(e){}}
function buy(){if(pos)return alert('Already in position - SELL first');if(price===0)return alert('Wait for price to load');pos={entry:price,qty:bal/price,tp:price*1.02,sl:price*0.95,cost:bal};bal=0;trades.push({time:new Date().toLocaleTimeString(),reason:'BUY',pnl:'0'});save();alert(`Bought! Entry $${price} | TP $${pos.tp.toFixed(6)} (+$${(pos.cost*0.02).toFixed(2)}) | SL $${pos.sl.toFixed(6)} (-$${(pos.cost*0.05).toFixed(2)})`)}
function sell(){if(!pos)return alert('No position');let exit=price;let gross=pos.qty*exit;let fee=gross*0.001;let net=gross-fee;let pnl=net-pos.cost;bal=net;let reason=exit>=pos.tp?'TAKE_PROFIT 2%':exit<=pos.sl?'STOP_LOSS 5%':'MANUAL';trades.push({time:new Date().toLocaleTimeString(),reason:reason,pnl:pnl.toFixed(4)});pos=null;save();alert(`${reason} P/L $${pnl.toFixed(4)} Balance $${bal.toFixed(2)}`)}
function resetBal(){if(confirm('Reset to $5?')){bal=5;pos=null;trades=[];save()}}
render();getPrice();setInterval(getPrice,5000);
document.getElementById('coin').addEventListener('change',()=>{ema=0;getPrice()});
</script></body></html>
