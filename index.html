<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>SLAP DASHBOARD V3 CLEAN</title><style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,system-ui}body{background:#0a0a0f;color:#fff;min-height:100vh;padding-bottom:80px}

.pnlrow{display:flex;justify-content:space-between;padding:12px 16px;font-size:13px;color:#8b8bb5}

.nav{position:fixed;bottom:0;left:0;right:0;background:#0f0f18;border-top:1px solid #1e1e32;display:flex;justify-content:space-around;padding:10px 0 14px}.navI{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10px;color:#5a5a7a}.navI.on{color:#3a8bff}
