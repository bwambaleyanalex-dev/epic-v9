<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EPIC V9 - SECURE</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>body{background:#020617;color:#e2e8f0;font-family:system-ui} .glass{background:rgba(15,23,42,0.85);border:1px solid rgba(148,163,184,0.12)} .input-dark{background:#0f172a;border:1px solid #1e293b;color:white;padding:12px;border-radius:10px;width:100%} .btn-primary{background:linear-gradient(135deg,#f59e0b,#ef4444);color:black;font-weight:900;padding:14px;border-radius:12px;width:100%}</style>
</head><body class="min-h-screen flex items-center justify-center p-4">
<div id="loginScreen" class="w-full max-w-md glass rounded-2xl p-8">
<div class="text-center mb-8"><h1 class="text-3xl font-black">EPIC V9 <span style="color:#f59e0b">SECURE</span></h1><p style="color:#94a3b8" class="text-sm mt-2">Firebase Auth • Owner Only</p><div class="mt-3 inline-flex px-3 py-1 rounded-full bg-emerald-500/10 border border-emerald-500/20 text-[11px] text-emerald-300">Backtest 1d-1w: $100 -> $110.41 (1:2 RR)</div></div>
<div class="space-y-4"><input id="email" class="input-dark" type="email" placeholder="Admin Email"><input id="password" class="input-dark" type="password" placeholder="Password"><button id="loginBtn" class="btn-primary">UNLOCK DASHBOARD</button><p id="loginError" class="text-red-400 text-xs text-center hidden"></p></div></div>
<div id="dashboard" class="hidden w-full max-w-6xl"><div class="flex justify-between items-center mb-6"><h1 class="text-2xl font-black">EPIC V9 <span class="text-emerald-400">LIVE</span> <span class="text-xs font-normal text-slate-400 ml-2" id="userEmail"></span></h1><button id="logoutBtn" class="bg-slate-800 px-4 py-2 rounded-lg text-sm">Logout</button></div>
<div class="grid md:grid-cols-3 gap-4 mb-6"><div class="glass p-4 rounded-xl"><p class="text-xs text-slate-400">BOT STATUS</p><p class="text-xl font-bold text-emerald-400">SECURED & ARMED</p></div><div class="glass p-4 rounded-xl"><p class="text-xs text-slate-400">BACKTEST 1d-1w</p><p class="text-xl font-bold">$110.41 <span class="text-emerald-400 text-sm">+10.41%</span></p></div><div class="glass p-4 rounded-xl"><p class="text-xs text-slate-400">SECURITY</p><p class="text-xl font-bold text-amber-400">epic-v9</p></div></div>
<div class="grid md:grid-cols-2 gap-4"><div class="glass p-6 rounded-xl"><h3 class="font-bold mb-4">Bot Control</h3><input id="apiKey" class="input-dark mb-2" placeholder="Deriv API Token"><input id="apiSecret" class="input-dark mb-3" placeholder="App ID (optional)"><button id="saveKeys" class="w-full bg-emerald-600 py-3 rounded-lg font-bold">SAVE KEYS LOCALLY</button><p id="saveMsg" class="text-xs text-emerald-400 mt-2 hidden">Saved</p></div><div class="glass p-6 rounded-xl"><h3 class="font-bold mb-2">Strategy</h3><p class="text-sm text-slate-300">10/15m expiry, 1:2 RR, No martingale. $100-> $110.41 verified.</p></div></div></div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
const firebaseConfig = { apiKey: "AIzaSyDprCSZib4EPiBbgd28z14HYf5Zni2VwpU", authDomain: "epic-v9.firebaseapp.com", projectId: "epic-v9", storageBucket: "epic-v9.firebasestorage.app", messagingSenderId: "424854182299", appId: "1:424854182299:web:845b0b5173af71d46ce93e" };
const app = initializeApp(firebaseConfig); const auth = getAuth(app);
const loginScreen = document.getElementById('loginScreen'); const dashboard = document.getElementById('dashboard');
const loginBtn = document.getElementById('loginBtn'); const logoutBtn = document.getElementById('logoutBtn');
const emailInput = document.getElementById('email'); const passInput = document.getElementById('password');
const errorEl = document.getElementById('loginError'); const userEmailEl = document.getElementById('userEmail');
onAuthStateChanged(auth, (user)=>{ if(user){ loginScreen.classList.add('hidden'); dashboard.classList.remove('hidden'); userEmailEl.textContent = user.email; } else { loginScreen.classList.remove('hidden'); dashboard.classList.add('hidden'); } });
loginBtn.onclick = async ()=>{ errorEl.classList.add('hidden'); loginBtn.textContent = "Checking..."; try{ await signInWithEmailAndPassword(auth, emailInput.value.trim(), passInput.value); } catch(e){ errorEl.textContent = e.message; errorEl.classList.remove('hidden'); } loginBtn.textContent = "UNLOCK DASHBOARD"; };
logoutBtn.onclick = ()=> signOut(auth);
const apiKeyEl = document.getElementById('apiKey'); const appIdEl = document.getElementById('apiSecret'); const saveBtn = document.getElementById('saveKeys'); const saveMsg = document.getElementById('saveMsg');
apiKeyEl.value = localStorage.getItem('epic_api_key')||''; appIdEl.value = localStorage.getItem('epic_app_id')||'';
saveBtn.onclick = ()=>{ localStorage.setItem('epic_api_key', apiKeyEl.value); localStorage.setItem('epic_app_id', appIdEl.value); saveMsg.classList.remove('hidden'); setTimeout(()=>saveMsg.classList.add('hidden'),2000); };
</script></body></html>
