<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SOL BOT V7.5</title>
<style>
*{box-sizing:border-box}
body{background:#0b0e14;color:#fff;font-family:Arial;padding:14px;margin:0}
.header{text-align:center;padding:6px 0 14px}
.header b{font-size:15px}
.header span{color:#a259ff}
.balance{text-align:center;background:#121626;border:1px solid #222a44;border-radius:18px;padding:18px 10px}
.balance small{color:#8a9ab5;font-size:12px}
.balance .big{font-size:42px;font-weight:900;margin:6px 0}
.balance .price{color:#a259ff;font-weight:900;font-size:16px}
.balance .daily{color:#8a9ab5;font-size:12px;margin-top:6px}
.cap{background:#121626;border-radius:14px;padding:12px;margin-top:12px}
.cap label{font-size:12px;color:#8a9ab5}
.capRow{display:flex;gap:8px;margin-top:8px}
.capRow input{flex:1;background:#0b0e14;border:1px solid #333;color:#fff;border-radius:10px;padding:12px;text-align:center;font-size:16px;font-weight:900}
.capRow button{background:#a259ff;color:#fff;border:0;border-radius:10px;padding:12px 16px;font-weight:900}
.capInfo{font-size:12px;color:#00d68f;margin-top:8px}
.openCard{background:#121626;border-radius:14px;padding:14px;margin-top:12px}
.openTop{display:flex;justify-content:space-between;font-size:13px}
.openTrade{margin-top:10px;font-size:14px;line-height:1.6;color:#cbd5e1}
.btns{display:flex;gap:10px;margin-top:12px}
.btnBuy{flex:1;background:#00d68f;color:#000;border:0;padding:18px;border-radius:14px;font-weight:900;font-size:16px}
.btnSell{flex:1;background:#ff2d55;color:#fff;border:0;padding:18px;border-radius:14px;font-weight:900;font-size:16px}
.mainBtn{width:100%;background:#00d68f;color:#000;border:0;padding:15px;border-radius:14px;font-weight:900;margin-top:12px;font-size:15px}
.mainBtn.paused{background:#ff2d55;color:#fff}
.smallBtns{display:flex;gap:8px;margin-top:10px}
.smallBtns button{flex:1;background:#1e2438;color:#8a9ab5;border:0;padding:10px;border-radius:10px;font-size:12px}
.hist{background:#121626;border-radius:14px;padding:12px;margin-top:12px}
table{width:100%;border-collapse:collapse;font-size:12px}
th{color:#8a9ab5;text-align:left}td{padding:7px 0;border-top:1px solid #222a44}
</style>
</head>
<body>
<div class="header"><b>◎ SOL <span>BOT</span></b></div>

<div class="balance">
<small>Balance</small>
<div class="big" id="balance">$10.16</div>
<div class="price" id="priceLine">Loading...</div>
<div class="daily" id="targetText">Daily $0.00 / $3.00</div>
</div>

<div class="cap">
<label>💰 Capital Limit</label>
<div class="capRow">
<input type="number" id="capitalInput" value="10.16">
<button onclick="saveCapital()">SAVE</button>
</div>
<div class="capInfo" id="capitalInfo">Capital $10.16 • Qty 0.05 SOL</div>
</div>

<div class="openCard">
<div class="openTop"><span id="runText">● RUNNING</span><span id="openPL">+$0.00</span></div>
<div class="openTrade" id="openTrade">Waiting for price...</div>
</div>

<div class="btns">
<button class="btnBuy" onclick="manualBuy()">BUY SOL</button>
<button class="btnSell" onclick="manualClose()">SELL</button>
</div>

<button class="mainBtn" id="mainBtn" onclick="toggleBot()">● RUNNING - Tap to STOP</button>

<div class="smallBtns">
<button onclick="resetDay()">↺ Reset Day</button>
<button onclick="fixNaN()">🛠️ Fix Error</button>
</div>

<div class="hist"><b>History</b>
<table><thead><tr><th>#</th><th>Buy → Sell</th><th>P/L</th><th>Reason</th></tr></thead>
<tbody id="history"><tr><td colspan="4" style="text-align:center;color:#8a9ab5">No trades yet</td></tr></tbody></table>
</div>

<script>
var balance=10.16, price=182.20, running=true, open=null, trades=0, profit=0;
var capitalLimit=10.16, TP=0.002, SL=0.001, FEE=0.01;
var TODAY=new Date().toDateString();
var KEY='sol_v75_clean';
function fmt(n){ n=parseFloat(n); if(isNaN(n)) n=0; return '$'+n.toFixed(2); }
function safeNum(v,d){ v=parseFloat(v); if(isNaN(v)||!isFinite(v)) return d; return v; }
function fixNaN(){ balance=10.16; profit=0; trades=0; open=null; capitalLimit=10.16; localStorage.removeItem(KEY); document.getElementById('history').innerHTML='<tr><td colspan="4" style="text-align:center;color:#8a9ab5">No trades yet</td></tr>'; render(); fetchPrice(); }
function getQty(p){ if(!p||p<50) return 0; var q=(capitalLimit*0.95)/p; if(isNaN(q)||!isFinite(q)) return 0; return q; }
function saveState(){ balance=safeNum(balance,10.16); profit=safeNum(profit,0); capitalLimit=safeNum(capitalLimit,10.16); try{ localStorage.setItem(KEY, JSON.stringify({balance:balance,profit:profit,trades:trades,open:open,running:running,date:TODAY,hist:document.getElementById('history').innerHTML,capitalLimit:capitalLimit})); }catch(e){} }
function loadState(){ try{ var s=JSON.parse(localStorage.getItem(KEY)||'null'); if(!s){ var old=JSON.parse(localStorage.getItem('sol_v741_nanfix')||'null'); if(old) s=old; } if(!s) return; if(s.date!==TODAY){ balance=safeNum(s.balance,10.16); capitalLimit=safeNum(s.capitalLimit,10.16); profit=0; trades=0; open=null; saveState(); return; } balance=safeNum(s.balance,10.16); profit=safeNum(s.profit,0); trades=safeNum(s.trades,0); open=s.open||null; running=s.running!==false; capitalLimit=safeNum(s.capitalLimit,10.16); if(open&&(isNaN(open.entry)||isNaN(open.qty))) open=null; if(s.hist&&trades>0) document.getElementById('history').innerHTML=s.hist; }catch(e){} }
function setPrice(n){ n=safeNum(n,0); if(!n) return; if(n<50||n>500) return; if(price>0&&Math.abs(n-price)>3) return; price=n; }
function saveCapital(){ var v=safeNum(document.getElementById('capitalInput').value,0); if(!v||v<5){ alert('Min $5'); document.getElementById('capitalInput').value=capitalLimit; return; } if(open){ alert('Close trade first'); return; } capitalLimit=v; if(v>balance) balance=v; render(); }
function render(){ balance=safeNum(balance,10.16); profit=safeNum(profit,0); capitalLimit=safeNum(capitalLimit,10.16); price=safeNum(price,182.20); document.getElementById('balance').textContent=fmt(balance); document.getElementById('targetText').textContent='Daily '+fmt(Math.max(0,profit))+' / $3.00 • '+trades+' trades'; document.getElementById('capitalInput').value=capitalLimit; var q=getQty(price); document.getElementById('capitalInfo').textContent='Capital '+fmt(capitalLimit)+' • Qty '+q.toFixed(4)+' SOL • Win +'+fmt(q*price*TP-FEE)+' / Loss -'+fmt(q*price*SL+FEE); document.getElementById('priceLine').textContent='SOL '+fmt(price)+' • Binance Live'; document.getElementById('runText').textContent=running?'● RUNNING':'⏸ PAUSED'; var mb=document.getElementById('mainBtn'); mb.textContent=running?'● RUNNING - Tap to STOP':'⏸ PAUSED - Tap to START'; mb.className='mainBtn'+(running?'':' paused'); if(open){ var pl=(price-open.entry)*open.qty; if(isNaN(pl)) pl=0; document.getElementById('openPL').textContent=(pl>=0?'+':'')+fmt(pl); document.getElementById('openPL').style.color=pl>=0?'#00d68f':'#ff2d55'; document.getElementById('openTrade').innerHTML='LOOP #'+open.id+' • '+open.qty.toFixed(4)+' SOL<br>Buy '+fmt(open.entry)+' → TP '+fmt(open.tp)+' • SL '+fmt(open.sl)+'<br>Now '+fmt(price); }else{ document.getElementById('openPL').textContent='+$0.00'; document.getElementById('openPL').style.color='#fff'; document.getElementById('openTrade').textContent=running?'No open trade - Auto will BUY soon':'Paused'; } saveState(); }
function toggleBot(){ running=!running; render(); }
function openBuy(){ if(open||!price||price<50) return; var q=getQty(price); if(!q) return; open={id:trades+1,entry:price,qty:q,tp:price*(1+TP),sl:price*(1-SL)}; render(); }
function manualBuy(){ if(!price||price<50){ alert('Wait for price'); return; } if(open){ alert('Already open'); return; } running=true; openBuy(); }
function closeTrade(reason){ if(!open) return; var exit=safeNum(price,open.entry); var net=safeNum((exit-open.entry)*safeNum(open.qty,0)-FEE,0); balance=safeNum(balance+net,balance); profit=safeNum(profit+net,profit); trades++; var hb=document.getElementById('history'); if(trades===1) hb.innerHTML=''; var row=document.createElement('tr'); row.innerHTML='<td>#'+trades+'</td><td>'+fmt(open.entry)+' → '+fmt(exit)+'</td><td style="color:'+(net>=0?'#00d68f':'#ff2d55')+'">'+(net>=0?'+':'')+fmt(net)+'</td><td>'+reason+'</td>'; hb.prepend(row); open=null; render(); if(profit>=3){ running=false; alert('Target $3 HIT'); render(); } if(profit<=-2){ running=false; alert('Daily Stop -$2'); render(); } }
function manualClose(){ if(!open){ alert('No open trade'); return; } closeTrade('MANUAL'); }
function resetDay(){ if(!confirm('Reset day? Keep '+fmt(balance)+'?')) return; profit=0; trades=0; open=null; running=false; document.getElementById('history').innerHTML='<tr><td colspan="4" style="text-align:center;color:#8a9ab5">No trades yet</td></tr>'; render(); }
function fetchPrice(){ fetch('https://api.binance.com/api/v3/ticker/price?symbol=SOLUSDT').then(r=>r.json()).then(j=>{ if(j.price){ setPrice(parseFloat(j.price)); render(); } }).catch(()=>{ fetch('https://api.coinbase.com/v2/prices/SOL-USD/spot').then(r=>r.json()).then(j=>{ if(j.data&&j.data.amount){ setPrice(parseFloat(j.data.amount)); render(); } }).catch(()=>{}); }); }
function tick(){ if(running&&price>50){ if(!open) openBuy(); else{ if(price>=open.tp) closeTrade('TP 0.2%'); else if(price<=open.sl) closeTrade('SL -0.1%'); } } render(); }
window.addEventListener('beforeunload', saveState); window.addEventListener('pagehide', saveState);
loadState(); render(); fetchPrice(); setInterval(fetchPrice,2000); setInterval(tick,2000);
</script>
</body>
</html>
