<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ULTRA FAST 0.3%</title><style>body{font-family:system-ui;background:#0a0e1a;color:#fff;padding:15px} .card{background:#151a2c;border-radius:16px;padding:14px;margin:10px 0;border:1px solid #2a3450} .badge{padding:6px 12px;border-radius:20px;font-weight:700;font-size:12px} .paper{background:#00ff8820;border:1px solid #00ff88;color:#00ff88} .fast{background:#ffcc00;color:#000;animation:pulse 1s infinite} @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}} button{width:100%;padding:14px;border-radius:12px;border:none;font-weight:700;margin:5px 0} .btn-dark{background:#2a3450;color:#fff} .price{font-size:32px;font-weight:800} .small{font-size:13px;opacity:.7} select,input{width:100%;padding:10px;border-radius:8px;background:#0a0e1a;color:#fff;border:1px solid #2a3450}</style></head><body>
<h2>⚡ ULTRA FAST 0.3% - $5</h2>
<div class="card"><span class="badge paper">PAPER MODE</span> <span class="badge fast">⚡ 0.3% SCALP</span><div class="price" id="price">Loading...</div><div class="small" id="ema">EMA...</div><div class="small" id="autostatus">Waiting...</div></div>
<div class="card"><div style="font-size:24px" id="bal">$5.00</div><div class="small" id="pnl">...</div><div class="small" id="pos">FLAT</div></div>
<div class="card">
<label class="small">Coin</label><select id="coin"><option value="DOGEUSDT" selected>DOGE - BEST FOR SCALP</option><option value="SHIBUSDT">SHIB</option><option value="BTCUSDT">BTC</option></select>
<label class="small">Take Profit % (YOU CAN CHANGE)</label><select id="tpSel"><option value="0.2">0.2% = $0.01 FASTEST (30 sec)</option><option value="0.3" selected>0.3% = $0.015 FAST (1 min) RECOMMENDED</option><option value="0.5">0.5% = $0.025 MEDIUM</option><option value="0.8">0.8% = $0.04 SLOW</option><option value="1">1% = $0.05</option></select>
<label class="small" style="display:flex;align-items:center;margin:8px 0"><input type="checkbox" id="auto" checked style="width:20px;height:20px;margin-right:10px"> AUTO ON</label>
<button class="btn-dark" onclick="resetBal()">Reset to $5 Paper</button>
</div>
<div class="card"><b>Trades</b><div id="trades" class="small">Waiting...</div></div>
<script>
let bal=parseFloat(localStorage.getItem('v11_bal')||'5'),pos=JSON.parse(localStorage.getItem('v11_pos')||'null'),trades=JSON.parse(localStorage.getItem('v11_trades')||'[]'),price=0,ema=0,lastCoin='';
function save(){localStorage.setItem('v11_bal',bal);localStorage.setItem('v11_pos',JSON.stringify(pos));localStorage.setItem('v11_trades',JSON.stringify(trades.slice(-100)));render()}
function render(){document.getElementById('bal').innerText=`PAPER: $${bal.toFixed(4)} ${pos?' (+ in DOGE)':''}`;let total=bal;if(pos)total=pos.qty*price;let pnl=total-5;document.getElementById('pnl').innerText=`Total: $${total.toFixed(4)} | P/L: ${pnl>=0?'+':''}$${pnl.toFixed(4)} | Trades: ${trades.length}`;if(pos){let curP=(price-pos.entry)/pos.entry*100;document.getElementById('pos').innerHTML=`<span style="color:#ffcc00">IN ${curP.toFixed(3)}% | Entry $${pos.entry} | TP ${pos.tpPct}% $${pos.tp.toFixed(6)}</span>`}else{document.getElementById('pos').innerText='FLAT - Will AUTO BUY'}document.getElementById('trades').innerHTML=trades.slice().reverse().slice(0,20).map(t=>`${t.time} ${t.reason} P/L $${t.pnl}<br>`).join('')||'Waiting...'}
async function getPrice(){try{const sym=document.getElementById('coin').value;if(sym!==lastCoin){ema=0;lastCoin=sym}let r=await fetch(`https://api.binance.com/api/v3/ticker/price?symbol=${sym}`);let j=await r.json();price=parseFloat(j.price);if(ema===0)ema=price*0.998;else ema=ema*0.97+price*0.03;document.getElementById('price').innerText=`$${price}`;let tpPct=parseFloat(document.getElementById('tpSel').value);document.getElementById('ema').innerText=`EMA $${ema.toFixed(6)} | ${price>ema?'🟢 BUY READY':'🔴 WAIT'} | TP ${tpPct}% SL 3%`;checkAuto();}catch(e){}}
function buy(){if(pos||price===0)return;let tpPct=parseFloat(document.getElementById('tpSel').value);pos={entry:price,qty:bal/price,tp:price*(1+tpPct/100),sl:price*0.97,cost:bal,tpPct:tpPct};bal=0;trades.push({time:new Date().toLocaleTimeString(),reason:`AUTO BUY ${tpPct}% TP`,pnl:'0'});save()}
function sell(){if(!pos)return;let exit=price;let gross=pos.qty*exit;let fee=gross*0.001;let net=gross-fee;let pnl=net-pos.cost;bal=net;let reason=exit>=pos.tp?`AUTO TP +${pos.tpPct}%`:'AUTO SL -3%';trades.push({time:new Date().toLocaleTimeString(),reason:reason,pnl:pnl.toFixed(4)});pos=null;save()}
function checkAuto(){if(!document.getElementById('auto').checked){document.getElementById('autostatus').innerText='Auto OFF';return}if(!pos&&price>ema&&price>0){let tpPct=document.getElementById('tpSel').value;document.getElementById('autostatus').innerText=`BUYING! TP ${tpPct}%`;buy()}else if(pos){if(price>=pos.tp){document.getElementById('autostatus').innerText=`SELLING +${pos.tpPct}%!`;sell()}else if(price<=pos.sl){document.getElementById('autostatus').innerText='SELLING SL';sell()}else{let curP=(price-pos.entry)/pos.entry*100;document.getElementById('autostatus').innerText=`In ${curP.toFixed(3)}% -> Need ${pos.tpPct}% $${pos.tp.toFixed(6)}`}}else{document.getElementById('autostatus').innerText=`Waiting > EMA $${ema.toFixed(6)}`}}
function resetBal(){if(confirm('Reset $5?')){bal=5;pos=null;trades=[];save()}}
render();getPrice();setInterval(getPrice,3000);
</script></body></html>
