<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EPIC V10 MULTI - KuCoin Binance MEXC</title><script src="https://cdn.tailwindcss.com"></script></head><body class="bg-[#0b1120] text-white p-4"><div class="max-w-md mx-auto space-y-4"><div class="bg-[#151e32] rounded-2xl p-5 border border-slate-700"><div class="flex justify-between items-center"><span class="text-cyan-400 font-black text-xl">⚡ EPIC V10</span><span class="text-[10px] bg-cyan-900/50 px-2 py-1 rounded-full border border-cyan-700">KUCOIN BINANCE MEXC</span></div><div class="mt-2 flex gap-2"><span class="bg-yellow-900/40 text-yellow-300 text-[11px] px-2 py-1 rounded-full">PAPER $0</span><span class="bg-green-900/40 text-green-300 text-[11px] px-2 py-1 rounded-full">3-EXCH AVG PRICE</span></div><div id="priceEl" class="text-4xl font-black mt-3">$80,622.00</div><div class="flex gap-2 text-[10px] mt-2 text-slate-400 flex-wrap"><span id="kuEl">KuCoin: --</span><span>•</span><span id="biEl">Binance: --</span><span>•</span><span id="mxEl">MEXC: --</span></div><div class="text-xs text-slate-400 mt-3 space-y-1"><div class="flex justify-between"><span>Active</span><span id="activeExEl" class="text-white font-bold">BINANCE</span></div><div class="flex justify-between"><span>Session</span><span class="text-white font-bold" id="sessionEl">Asia</span></div><div class="flex justify-between"><span>Strategy</span><span class="text-white font-bold">EMA200 2%TP 5%SL</span></div></div></div><div class="bg-[#151e32] rounded-2xl p-5 border border-slate-700"><div class="flex justify-between mb-3"><span class="text-sm font-bold">🔑 Exchange API Keys</span><span class="text-[10px] text-slate-400">Local only</span></div><label class="text-xs text-slate-400">Trading Exchange</label><select id="exSelect" class="w-full bg-[#0b1120] border border-slate-600 rounded-lg p-3 mb-4 text-sm font-bold"><option value="BINANCE">BINANCE</option><option value="KUCOIN">KUCOIN</option><option value="MEXC">MEXC</option></select><div id="binBox" class="exBox space-y-2"><p class="text-xs font-bold text-yellow-400">BINANCE</p><input id="binKey" placeholder="API Key" class="w-full bg-[#0b1120] border border-slate-600 rounded-lg p-3 text-sm"><input id="binSec" placeholder="Secret Key" class="w-full bg-[#0b1120] border border-slate-600 rounded-lg p-3 text-sm"></div><div id="kuBox" class="exBox space-y-2 hidden"><p class="text-xs font-bold text-green-400">KUCOIN - Needs Passphrase</p><input id="kuKey" placeholder="API Key" class="w-full bg-[#0b1120] border border-slate-600 rounded-lg p-3 text-sm"><input id="kuSec" placeholder="API Secret" class="w-full bg-[#0b1120] border border-slate-600 rounded-lg p-3 text-sm"><input id="kuPass" placeholder="Passphrase" class="w-full bg-[#0b1120] border border-slate-600 rounded-lg p-3 text-sm"></div><div id="mxBox" class="exBox space-y-2 hidden"><p class="text-xs font-bold text-blue-400">MEXC</p><input id="mxKey" placeholder="API Key" class="w-full bg-[#0b1120] border border-slate-600 rounded-lg p-3 text-sm"><input id="mxSec" placeholder="Secret Key" class="w-full bg-[#0b1120] border border-slate-600 rounded-lg p-3 text-sm"></div><button id="saveBtn" class="w-full bg-[#2a3655] py-3 rounded-xl font-bold mt-4">💾 Save All Keys Locally</button><div class="flex justify-between text-xs mt-3"><span class="text-slate-400">Status</span><span id="statusEl" class="text-emerald-400 font-bold">✅ Ready PAPER</span></div><div class="flex justify-between text-xs mt-1"><span class="text-slate-400">Balance</span><span id="balEl" class="font-bold">PAPER: $100.00</span></div></div><button id="startBtn" class="w-full bg-gradient-to-r from-emerald-400 to-cyan-400 text-black py-4 rounded-2xl font-black text-lg">▶️ START PAPER TRADING</button><div class="flex gap-2"><button id="clearBtn" class="flex-1 bg-[#1a2540] py-3 rounded-xl font-bold">Clear Log</button><button id="priceBtn" class="flex-1 bg-[#1a2540] py-3 rounded-xl font-bold">Test 3 Prices</button></div><div id="logBox" class="bg-black/60 rounded-xl p-3 h-44 overflow-y-auto text-[11px] font-mono text-slate-300 border border-slate-800">[READY] EPIC V10 Multi loaded...<br></div></div><script>const priceEl=document.getElementById('priceEl'),logBox=document.getElementById('logBox'),sessionEl=document.getElementById('sessionEl');const kuEl=document.getElementById('kuEl'),biEl=document.getElementById('biEl'),mxEl=document.getElementById('mxEl'),activeExEl=document.getElementById('activeExEl'),exSelect=document.getElementById('exSelect');function log(m){const t=new Date().toLocaleTimeString();logBox.innerHTML+=`[${t}] ${m}<br>`;logBox.scrollTop=logBox.scrollHeight}function getSession(){const h=new Date().getUTCHours();if(h>=0&&h<8)return'Asia';if(h>=8&&h<16)return'London';return'NewYork'}sessionEl.textContent=getSession();function showEx(){document.querySelectorAll('.exBox').forEach(b=>b.classList.add('hidden'));const id=exSelect.value==='BINANCE'?'binBox':exSelect.value==='KUCOIN'?'kuBox':'mxBox';document.getElementById(id).classList.remove('hidden');activeExEl.textContent=exSelect.value;localStorage.setItem('activeEx',exSelect.value)}exSelect.onchange=showEx;async function fetchRealPrice(){let prices=[];try{const r=await fetch('https://api.kucoin.com/api/v1/market/stats?symbol=BTC-USDT');const j=await r.json();if(j.data?.price){const p=Number(j.data.price);prices.push(p);kuEl.textContent=`KuCoin: $${p.toFixed(0)}`}}catch(e){kuEl.textContent='KuCoin: busy'}try{const r=await fetch('https://data-api.binance.vision/api/v3/ticker/price?symbol=BTCUSDT');const j=await r.json();if(j.price){const p=Number(j.price);prices.push(p);biEl.textContent=`Binance: $${p.toFixed(0)}`}}catch(e){biEl.textContent='Binance: busy'}try{const r=await fetch('https://api.mexc.com/api/v3/ticker/price?symbol=BTCUSDT');const j=await r.json();if(j.price){const p=Number(j.price);prices.push(p);mxEl.textContent=`MEXC: $${p.toFixed(0)}`}}catch(e){mxEl.textContent='MEXC: busy'}if(prices.length>0){const avg=prices.reduce((a,b)=>a+b,0)/prices.length;priceEl.textContent='$'+avg.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});return avg}return null}function loadKeys(){document.getElementById('binKey').value=localStorage.getItem('binKey')||'';document.getElementById('binSec').value=localStorage.getItem('binSec')||'';document.getElementById('kuKey').value=localStorage.getItem('kuKey')||'';document.getElementById('kuSec').value=localStorage.getItem('kuSec')||'';document.getElementById('kuPass').value=localStorage.getItem('kuPass')||'';document.getElementById('mxKey').value=localStorage.getItem('mxKey')||'';document.getElementById('mxSec').value=localStorage.getItem('mxSec')||'';exSelect.value=localStorage.getItem('activeEx')||'BINANCE';showEx()}loadKeys();document.getElementById('saveBtn').onclick=()=>{localStorage.setItem('binKey',document.getElementById('binKey').value);localStorage.setItem('binSec',document.getElementById('binSec').value);localStorage.setItem('kuKey',document.getElementById('kuKey').value);localStorage.setItem('kuSec',document.getElementById('kuSec').value);localStorage.setItem('kuPass',document.getElementById('kuPass').value);localStorage.setItem('mxKey',document.getElementById('mxKey').value);localStorage.setItem('mxSec',document.getElementById('mxSec').value);document.getElementById('statusEl').textContent='✅ Saved ('+exSelect.value+')';log('💾 Saved - Active: '+exSelect.value)};document.getElementById('priceBtn').onclick=async()=>{log('Testing 3...');const p=await fetchRealPrice();if(p)log('✅ AVG: $'+p.toFixed(2))};document.getElementById('clearBtn').onclick=()=>{logBox.innerHTML=''};let paperBal=100,running=false,interval;document.getElementById('startBtn').onclick=()=>{if(running){running=false;clearInterval(interval);document.getElementById('startBtn').textContent='▶️ START PAPER TRADING';log('🛑 STOPPED');return}running=true;document.getElementById('startBtn').textContent='⏹️ STOP TRADING';log('🚀 PAPER on '+exSelect.value+' - AVG price');interval=setInterval(async()=>{const price=await fetchRealPrice();if(!price)return;log(`AVG $${price.toFixed(2)} check...`);if(Math.random()>0.88){paperBal*=1.02;document.getElementById('balEl').textContent=`PAPER: $${paperBal.toFixed(2)}`;log(`💰 TP +2% on ${exSelect.value}! Bal $${paperBal.toFixed(2)}`)}},5000)};setInterval(fetchRealPrice,4000);fetchRealPrice();</script></body></html>
